<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css">
    <title>Productos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="bg-gray-200">
    
<nav class="sticky top-0 z-5 flex flex-wrap items-center justify-between gap-4 p-4 bg-blue-700 text-white ">

    <!-- Enlaces -->
    <div class="flex items-center gap-5">
        <a href="#resultado" class="hover:text-yellow-300 transition-colors">
            Productos
        </a>
    </div>

    <!-- Filtro y buscador -->
    <div class="flex flex-1 flex-wrap items-center justify-end gap-3 min-w-[250px]">

       

        <form class="flex flex-1 min-w-[180px] max-w-md gap-2" id="form-inicio">

            <input type="search" 
                class="w-full min-w-0 bg-white text-black rounded-md px-3 py-2"
                placeholder="Buscar producto...">

            <button type="submit"
                class="px-3 py-2 bg-yellow-400 text-black rounded-md hover:bg-yellow-500 transition-colors">

                <svg xmlns="http://www.w3.org/2000/svg"
                    fill="none" viewBox="0 0 24 24" stroke-width="2"
                    stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
                </svg>

            </button>
        </form>
        <a href="./carrito.html"
   class="flex items-center gap-2 hover:text-yellow-300 transition-colors">

   

    <span class="relative inline-flex">

        <!-- Icono del carrito -->
        <svg xmlns="http://www.w3.org/2000/svg"
             width="27" height="27"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.8"
             stroke-linecap="round"
             stroke-linejoin="round">

            <circle cx="9" cy="21" r="1"/>
            <circle cx="19" cy="21" r="1"/>
            <path d="M2 3h2l2.5 12.5a2 2 0 0 0 2 1.5h9.8a2 2 0 0 0 2-1.5L22 8H5"/>
        </svg>

        <!-- Contador -->
        <span class="contador absolute -top-2 -right-2 min-w-[17px] h-[17px] 
                     flex items-center justify-center rounded-full 
                     bg-red-500 text-white text-[10px] font-bold px-1">
            0
        </span>

    </span>
</a>
    </div>
</nav>
<main>
  <section class="p-2 "> 
    <div class="flex justify-end gap-3 w-full max-w-md ml-auto">
    <select id="filtro-inicio"
        class="flex-1 min-w-0 bg-white text-black rounded-md p-2">
        <option value="Todos">Todos los precios</option>
        <option value="0-25000">0 - 25000</option>
        <option value="25000-100000">25000 - 100000</option>
        <option value="100000-300000">100000 - 300000</option>
    </select>

    <select id="orden-productos"
        class="flex-1 min-w-0 bg-white text-black rounded-md p-2">
        <option value="original">Orden original</option>
        <option value="nombre">Nombre: A - Z</option>
        <option value="menor">Precio: menor a mayor</option>
        <option value="mayor">Precio: mayor a menor</option>
    </select>
</div>
    <p class="invisible text-center text-xl my-2 font-medium" id="mensaje-error">El nombre ingresado no concuerda con ningún producto</p>
    <div id="resultado" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6 justify-items-center max-w-6xl mx-auto p-3"></div>
    </section>
    </main>
    
<footer class="bg-blue-900 text-white mt-5 sticky bottom-0 z-5">
    <div class="max-w-7xl mx-auto px-4 py-8">

        <div class="flex flex-col md:flex-row justify-between items-center gap-6">

            <!-- Nombre -->
            <div class="text-center md:text-left">
                <h2 class="text-xl font-bold">
                    Mi Tienda
                </h2>
                <p class="text-sm text-blue-200">
                    Tu lugar para encontrar lo que necesitás.
                </p>
            </div>
             <div class="text-center text-sm text-blue-200">
            © 2026 Mi Tienda. Todos los derechos reservados.
        </div>

            <!-- Redes sociales -->
            <div class="flex items-center gap-6 text-2xl">

                <a href="#" aria-label="WhatsApp"
                   class="hover:text-green-400 transition duration-300">
                    <i class="fa-brands fa-whatsapp"></i>
                </a>

                <a href="#" aria-label="Instagram"
                   class="hover:text-pink-400 transition duration-300">
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <a href="#" aria-label="X"
                   class="hover:text-gray-300 transition duration-300">
                    <i class="fa-brands fa-x-twitter"></i>
                </a>

                <a href="#" aria-label="YouTube"
                   class="hover:text-red-400 transition duration-300">
                    <i class="fa-brands fa-youtube"></i>
                </a>

            </div>
        </div>

       <!--  <hr class="my-6 border-blue-700"> -->

        <!-- <div class="text-center text-sm text-blue-200">
            © 2026 Mi Tienda. Todos los derechos reservados.
        </div> -->

    </div>
</footer>

    <script src="script.js"></script>
</body>
</html>
