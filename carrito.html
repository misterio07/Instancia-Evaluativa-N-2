<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script
            src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="stylesheet" href="carrito.css">
        <title>Carrito</title>
    </head>
    <body>
        <nav
            class="flex flex-row bg-yellow-400 justify-around content-center items-center gap-1 h-9 sm:gap-2 lg:gap-3">
            <a
                href="./index.html">Inicio</a><!--icono del lugar o volver al inicio-->
            <form class="flex-grow-1 flex flex-row justify-between gap-2">
                <input type="text" class="w-full bg-white rounded-sm">
                <button type="submit" class="px-4 py-1 border-l hover:cursor-pointer"><svg xmlns="http://www.w3.org/2000/svg"
                        fill="none" viewBox="0 0 24 24" stroke-width="2"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                    </svg>
                </button>

            </form>
            <select class="text-center w-1/5 mr-1 sm:w-1/6 lg:w-1/7" id="filtro">
                <option value="Todos">Todos</option>
                <option value="0-25000">0 - 25000</option>
                <option value="25000-100000">25000 - 100000</option>
                <option value="100000-300000">100000 - 300000</option>
            </select>
        </nav>
        <main>
            <section class="mx-2 mt-1" id="carrito">
            </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
